<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>LEMONタスク管理</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    body {
      margin: 0;
      padding: 24px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        sans-serif;

      background: #f5f6f8;
      color: #222;
    }


    .card {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background: white;
      border-radius: 14px;

      box-shadow:
        0 1px 5px
        rgba(0,0,0,.08);
    }


    h2 {
      margin-top: 0;
    }


    .row {
      padding: 12px 0;
      border-bottom:
        1px solid #eee;
    }


    .row:last-child {
      border-bottom: 0;
    }


    .label {
      font-size: 12px;
      color: #777;
      margin-bottom: 5px;
    }


    .value {
      font-size: 15px;
      word-break: break-all;
    }


    .ok {
      color: #087a39;
      font-weight: bold;
    }


    .error {
      color: #c62828;
      font-weight: bold;
    }

  </style>

</head>


<body>

<div class="card">

  <h2>
    LEMONタスク管理
  </h2>

  <p>
    サーバー認証テスト
  </p>


  <div class="row">

    <div class="label">
      LIFF
    </div>

    <div
      id="liffStatus"
      class="value"
    >
      初期化中...
    </div>

  </div>


  <div class="row">

    <div class="label">
      IDトークン
    </div>

    <div
      id="tokenStatus"
      class="value"
    >
      -
    </div>

  </div>


  <div class="row">

    <div class="label">
      Cloudflare Worker
    </div>

    <div
      id="workerStatus"
      class="value"
    >
      -
    </div>

  </div>


  <div class="row">

    <div class="label">
      LINE本人確認
    </div>

    <div
      id="authStatus"
      class="value"
    >
      -
    </div>

  </div>


  <div class="row">

    <div class="label">
      LINE UID
    </div>

    <div
      id="userId"
      class="value"
    >
      -
    </div>

  </div>


</div>


<script>

const LIFF_ID =
  '2011625016-RaUEIe98';


const WORKER_URL =
  'https://lemon-task-api.hr-c62.workers.dev/';


async function main() {

  try {

    /*
     * LIFF初期化
     */
    await liff.init({
      liffId: LIFF_ID
    });


    setSuccess(
      'liffStatus',
      '✅ 初期化成功'
    );


    /*
     * LINEログイン確認
     */
    if (!liff.isLoggedIn()) {

      throw new Error(
        'LINEにログインされていません。'
      );

    }


    /*
     * IDトークン取得
     */
    const idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        'IDトークンを取得できませんでした。'
      );

    }


    setSuccess(
      'tokenStatus',
      '✅ 取得成功'
    );


    /*
     * Workerへ送信
     */
    document
      .getElementById(
        'workerStatus'
      )
      .textContent =
      '接続中...';


    const response =
      await fetch(
        WORKER_URL,
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({
              idToken:
                idToken
            })
        }
      );


    const result =
      await response.json();


    if (!response.ok) {

      throw new Error(
        result.message ||
        'Workerでエラーが発生しました。'
      );

    }


    setSuccess(
      'workerStatus',
      '✅ 接続成功'
    );


    if (!result.ok) {

      throw new Error(
        result.message ||
        'LINE認証に失敗しました。'
      );

    }


    setSuccess(
      'authStatus',
      '✅ LINE本人確認成功'
    );


    document
      .getElementById(
        'userId'
      )
      .textContent =
      result.userIdMasked;


  } catch (error) {

    console.error(error);


    document
      .getElementById(
        'authStatus'
      )
      .className =
      'value error';


    document
      .getElementById(
        'authStatus'
      )
      .textContent =
      '❌ ' +
      (
        error.message ||
        String(error)
      );

  }

}


function setSuccess(
  id,
  text
) {

  const el =
    document.getElementById(id);


  el.className =
    'value ok';


  el.textContent =
    text;

}


main();

</script>

</body>

</html>
