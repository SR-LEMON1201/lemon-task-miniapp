<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>LEMONタスク管理</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    body {
      margin: 0;
      padding: 24px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .card {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 1px 5px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
    }

    .row {
      padding: 11px 0;
      border-bottom: 1px solid #eee;
    }

    .row:last-child {
      border-bottom: 0;
    }

    .label {
      font-size: 12px;
      color: #777;
      margin-bottom: 4px;
    }

    .value {
      font-size: 15px;
      word-break: break-all;
    }

    .ok {
      color: #087a39;
      font-weight: bold;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }

  </style>

</head>

<body>

<div class="card">

  <h2>LEMONタスク管理</h2>

  <p>LINEユーザー識別テスト</p>


  <div class="row">

    <div class="label">
      LIFF
    </div>

    <div
      id="liffStatus"
      class="value"
    >
      初期化中...
    </div>

  </div>


  <div class="row">

    <div class="label">
      LINEログイン
    </div>

    <div
      id="loginStatus"
      class="value"
    >
      -
    </div>

  </div>


  <div class="row">

    <div class="label">
      表示名
    </div>

    <div
      id="displayName"
      class="value"
    >
      -
    </div>

  </div>


  <div class="row">

    <div class="label">
      LINEユーザーID
    </div>

    <div
      id="userId"
      class="value"
    >
      -
    </div>

  </div>


  <div class="row">

    <div class="label">
      IDトークン
    </div>

    <div
      id="tokenStatus"
      class="value"
    >
      -
    </div>

  </div>


  <div class="row">

    <div class="label">
      実行環境
    </div>

    <div
      id="environment"
      class="value"
    >
      -
    </div>

  </div>


</div>


<script>

const LIFF_ID =
  '2011625016-RaUEIe98';


async function main() {

  try {

    /*
     * LIFF初期化
     */
    await liff.init({
      liffId: LIFF_ID
    });


    document
      .getElementById('liffStatus')
      .textContent =
      '✅ 初期化成功';


    document
      .getElementById('liffStatus')
      .className =
      'value ok';


    /*
     * ログイン状態
     */
    const loggedIn =
      liff.isLoggedIn();


    document
      .getElementById('loginStatus')
      .textContent =
      loggedIn
        ? '✅ ログイン済み'
        : '❌ 未ログイン';


    if (!loggedIn) {

      throw new Error(
        'LINEログインされていません。'
      );

    }


    /*
     * IDトークン
     */
    const idToken =
      liff.getIDToken();


    document
      .getElementById('tokenStatus')
      .textContent =
      idToken
        ? '✅ 取得成功'
        : '❌ 取得できません';


    if (!idToken) {

      throw new Error(
        'IDトークンを取得できませんでした。'
      );

    }


    /*
     * IDトークンの内容を
     * 画面表示用として取得
     */
    const decoded =
      liff.getDecodedIDToken();


    if (!decoded) {

      throw new Error(
        'ユーザー情報を取得できませんでした。'
      );

    }


    /*
     * 表示名
     */
    document
      .getElementById('displayName')
      .textContent =
      decoded.name || '(取得なし)';


    /*
     * LINE UID
     *
     * テスト画面なので一部マスク
     */
    document
      .getElementById('userId')
      .textContent =
      maskUserId(
        decoded.sub
      );


    /*
     * 環境
     */
    document
      .getElementById('environment')
      .textContent =
      'LINE内：' +
      liff.isInClient() +
      ' / OS：' +
      liff.getOS();


  } catch (err) {

    document
      .getElementById('liffStatus')
      .textContent =
      '❌ エラー：' +
      (err.message || String(err));


    document
      .getElementById('liffStatus')
      .className =
      'value error';


    console.error(err);

  }

}


function maskUserId(userId) {

  if (!userId) {
    return '(取得なし)';
  }


  if (userId.length < 12) {
    return userId;
  }


  return (
    userId.substring(0, 6) +
    '***************' +
    userId.substring(
      userId.length - 5
    )
  );

}


main();

</script>

</body>

</html>
